<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#121833"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="996" height="326" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="326" rx="22" fill="none" stroke="url(#ln)" stroke-width="2" stroke-dasharray="140 1400">
    <animate attributeName="stroke-dashoffset" values="0;-1540" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="996" height="326" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <text x="40" y="62" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#f1f5f9">🐧 NovaAI OS</text>
  <text x="40" y="92" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">A custom Ubuntu Remix where AI is part of the OS, not an app.</text>

  <!-- status pill -->
  <rect x="800" y="38" width="160" height="34" rx="17" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
  <circle cx="825" cy="55" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="842" y="60" font-family="'Courier New',monospace" font-size="14" fill="#22d3ee">in development</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- row 1 -->
    <g>
      <rect x="40" y="125" width="290" height="80" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="60" y="158" font-size="18" font-weight="700" fill="#e2e8f0">🤖 AI Agent</text>
      <text x="60" y="184" font-size="14" fill="#94a3b8">Built-in LLM + voice assistant</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="355" y="125" width="290" height="80" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="375" y="158" font-size="18" font-weight="700" fill="#e2e8f0">🧘 Digital Wellbeing</text>
      <text x="375" y="184" font-size="14" fill="#94a3b8">System-level usage awareness</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="670" y="125" width="290" height="80" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="690" y="158" font-size="18" font-weight="700" fill="#e2e8f0">🔍 Universal Search</text>
      <text x="690" y="184" font-size="14" fill="#94a3b8">AI-powered search everywhere</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="40" y="225" width="445" height="80" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="60" y="258" font-size="18" font-weight="700" fill="#e2e8f0">🧩 Tray Widgets &amp; Extensions</text>
      <text x="60" y="284" font-size="14" fill="#94a3b8">Quick access to the agent from the system tray</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="515" y="225" width="445" height="80" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="535" y="258" font-size="18" font-weight="700" fill="#e2e8f0">☁️ Cloud Sync</text>
      <text x="535" y="284" font-size="14" fill="#94a3b8">Supabase / Nextcloud</text>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="5s" begin="3.2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
