<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#141a35"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#a855f7" stop-opacity=".5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#f472b6" stop-opacity=".4"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="280" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <circle r="190" fill="url(#o1)">
      <animate attributeName="cx" values="120;300;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;200;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="210" fill="url(#o2)">
      <animate attributeName="cx" values="520;700;520" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;60;260" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="170" fill="url(#o3)">
      <animate attributeName="cx" values="900;760;900" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;220;40" dur="15s" repeatCount="indefinite"/>
    </circle>
    <!-- floating dots -->
    <g fill="#ffffff" opacity=".6">
      <circle cx="90" cy="220" r="2"><animate attributeName="cy" values="220;40;220" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="250" r="1.5"><animate attributeName="cy" values="250;30;250" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="230" r="2"><animate attributeName="cy" values="230;50;230" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="250" r="1.5"><animate attributeName="cy" values="250;40;250" dur="14s" repeatCount="indefinite"/></circle>
    </g>
    <!-- terminal tag -->
    <text x="500" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" fill="#22d3ee" opacity=".9">~/vishal51512 $ whoami</text>
    <!-- name -->
    <text x="500" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#tx)" letter-spacing="1">Vishal Songara</text>
    <!-- rotating subtitles -->
    <g font-family="'Courier New',monospace" font-size="21" fill="#cbd5e1" text-anchor="middle">
      <text x="500" y="198">Building NovaAI OS 🐧
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="198" opacity="0">AI Agents + Linux Internals 🤖
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.5;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="198" opacity="0">Real-world problems, not just demos 🚀
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="198" opacity="0">Depth over hype. Systems over shortcuts.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    </g>
    <!-- blinking cursor -->
    <rect x="496" y="226" width="8" height="3" rx="1.5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
